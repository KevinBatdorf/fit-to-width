name: Playwright Tests (WP Nightly)
permissions:
  contents: write
  pull-requests: write
on:
  push:
    branches: main
  schedule:
    - cron: '0 8 * * *'

jobs:
  discover:
    name: Discover test suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.find.outputs.suites }}
    steps:
    - uses: actions/checkout@v6
    - id: find
      run: |
        suites=$(find . -name '*.spec.ts' -not -path '*/node_modules/*' | while read spec; do
          dir=$(dirname "$spec")
          if [ -f "$dir/blueprint.json" ]; then
            basename "$spec" .spec.ts
          fi
        done | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "suites=$suites" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.suite }}
    needs: discover
    concurrency:
      group: ${{ github.workflow }} - ${{ matrix.suite }} - ${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.discover.outputs.suites) }}

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'npm'

    - run: npm ci --prefer-offline --no-audit --no-fund

    - name: Get Playwright version
      id: pw-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      id: pw-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.pw-version.outputs.version }}

    - name: Install Playwright Browsers
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Install Playwright deps only
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    - name: Build project
      run: npm run build
      env:
        CI: true

    - name: Run Playwright tests
      run: RUN_PROJECT="${{ matrix.suite }}" npx playwright test --project="${{ matrix.suite }}"
      env:
        WP_VERSION: nightly

    - name: Update snapshots
      if: failure()
      run: RUN_PROJECT="${{ matrix.suite }}" npx playwright test --project="${{ matrix.suite }}" --update-snapshots
      env:
        WP_VERSION: nightly

    - name: Create or update snapshot PR
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add '**/*-snapshots/**'
        if git diff --cached --quiet; then
          echo "No snapshot changes"
          exit 0
        fi
        branch="update/playwright-snapshots-nightly-${{ matrix.suite }}"
        git checkout -B "$branch"
        git commit -m "Update Playwright snapshots for ${{ matrix.suite }} (nightly)"
        git push --force-with-lease -u origin "$branch"
        if ! gh pr view "$branch" &>/dev/null; then
          gh pr create \
            --title "Update Playwright snapshots for ${{ matrix.suite }} (nightly)" \
            --body "Auto-generated by nightly CI after snapshot mismatch." \
            --base main
        fi

    - name: Set artifact name
      if: ${{ !cancelled() }}
      id: artifact
      run: echo "name=pw-nightly-${{ matrix.suite }}" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v6
      if: ${{ !cancelled() }}
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: playwright-report/
        retention-days: 30
